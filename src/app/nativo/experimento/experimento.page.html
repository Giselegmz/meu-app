
<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Acelerômetro</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-card>
    <ion-card-header>
      <ion-card-title>Sensor de movimento</ion-card-title>
    </ion-card-header>

    <ion-card-content>

      <p>Movimento nos três eixos:</p>

      <h2>X: {{ x | number:'1.2-2' }}</h2>
      <h2>Y: {{ y | number:'1.2-2' }}</h2>
      <h2>Z: {{ z | number:'1.2-2' }}</h2>

      <p>{{ mensagem }}</p>

      <ion-button
        expand="block"
        (click)="iniciarAcelerometro()"
        [disabled]="ativo">
        Iniciar acelerômetro
      </ion-button>

      <ion-button
        expand="block"
        color="danger"
        (click)="pararAcelerometro()"
        [disabled]="!ativo">
        Parar acelerômetro
      </ion-button>

    </ion-card-content>
  </ion-card>

</ion-content>
