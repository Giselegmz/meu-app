
<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Câmera</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-card>
    <ion-card-header>
      <ion-card-title>Capturar fotografia</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <ion-button expand="block" (click)="tirarFoto()">
        Tirar foto
      </ion-button>

      <div *ngIf="foto">
        <p>Foto capturada:</p>
        <img [src]="foto" alt="Foto capturada"
             style="width: 100%; border-radius: 10px;">
      </div>
    </ion-card-content>
  </ion-card>

</ion-content>
