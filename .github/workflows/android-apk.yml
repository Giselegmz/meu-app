
name: Gerar APK Android

on:
  push:
    branches:
      - feature/diario-protegido
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Debug
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar Ionic Angular
        run: npm run build

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Gerar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verificar APK e permissoes
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)
          test -n "$AAPT"
          "$AAPT" dump permissions "$APK_PATH"

      - name: Preparar APK para download
        run: |
          mkdir -p APK
          cp android/app/build/outputs/apk/debug/app-debug.apk APK/One-Diario.apk
          test -s APK/One-Diario.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: One-Diario
          path: APK/One-Diario.apk
          if-no-files-found: error
          retention-days: 14
