name: Gerar APK Android

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Compilar projeto
        run: npm run build

      - name: Sincronizar Android
        run: npx cap sync android

      - name: Gerar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verificar permissões do APK
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)
          test -n "$AAPT"
          "$AAPT" dump permissions "$APK_PATH"

      - name: Preparar APK para download
        run: |
          mkdir -p APK
          cp android/app/build/outputs/apk/debug/app-debug.apk APK/One-Diario.apk
          test -s APK/One-Diario.apk

      - name: Disponibilizar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: One-Diario
          path: APK/One-Diario.apk
          if-no-files-found: error
          retention-days: 14
